services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -plocal-root-only --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: mysql+aiomysql://rag:rag@mysql:3306/rag
      QDRANT_URL: http://qdrant:6333
      DOCUMENTS_DIR: /app/data/documents
      ARTIFACTS_DIR: /app/data/artifacts
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemma-4-31b-it}
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
    depends_on:
      mysql: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  qdrant_data:
